name: Release

# Tags only. A manual trigger has no tag, so the version check below would be
# skipped while the publish still ran. Re-run a failed release from the Actions
# UI against the original tag event instead.
on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv build

      - name: Verify the distribution
        run: uv run --no-project python .github/scripts/verify_dist.py

      - name: Check the tag matches the packaged version
        run: uv run --no-project python .github/scripts/check_tag.py "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Requires a Trusted Publisher on PyPI naming this repository, this
    # workflow file, and this environment. See the README.
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    # After PyPI, deliberately. A PyPI version cannot be replaced, only
    # superseded, whereas a GitHub release can be edited or deleted -- so the
    # irreversible step goes first, and the release only appears if it worked.
    needs: pypi-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are generated from the history since the last tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Generated notes list merged pull requests, so they are thin if you
      # commit straight to main. Keeping a CHANGELOG.md and passing
      # `--notes-file` instead is the alternative; see the README.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
